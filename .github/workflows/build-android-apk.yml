name: Build Universal Android Companion APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Signed Universal APK (ARM64 / ARMv7 / x86_64)
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleRelease
          cp build/outputs/apk/release/*.apk ../callsign-companion-universal.apk

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: callsign-companion-universal-apk
          path: callsign-companion-universal.apk
